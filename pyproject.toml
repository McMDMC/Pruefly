[project]
name = "pruefly"
version = "0.1.0"
description = "Photograph a Grundschule test, get a verified variant as PDF."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "anthropic>=0.60",
  "google-genai>=1.0",
  "weasyprint>=62",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pruefly*"]

[tool.setuptools.package-data]
pruefly = ["render/sheet.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
